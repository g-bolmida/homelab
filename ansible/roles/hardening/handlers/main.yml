---
- name: Validate sshd config
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: restart sshd

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
  listen: restart sshd

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

---
k3s_cluster:
  children:
    server:
      hosts:
        192.168.1.201: # Prometheus
    agent:
      hosts:
        192.168.1.202: # Sulaco

  vars:
    cluster_context: k3s-homelab
    ansible_port: 22
    ansible_user: "gbolmida"
    k3s_version: v1.36.3+k3s1
    token: "{{ lookup('env', 'K3S_TOKEN') }}"
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
    user_kubectl: true